name: Tests

# Runs the stdio server test suite on every push and PR. test.js exits non-zero
# when any assertion fails, so a red run here is a real failure.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Guards the npm tarball: `files: ["extended/"]` packs from the filesystem,
      # so an untracked or stray directory under extended/ would ship even though
      # git never saw it. Fail loudly instead of publishing it.
      - name: Check tarball contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -q "reference-generated" /tmp/pack.txt; then
            echo "::error::extended/reference-generated/ would ship in the npm tarball"
            exit 1
          fi
